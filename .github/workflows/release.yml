name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to build, e.g. 0.2.0
        required: true
        type: string
      publish:
        description: Push to NuGet
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            value="${{ inputs.version }}"
          else
            value="${GITHUB_REF_NAME#v}"
          fi
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          if ! echo "$value" | grep -Eq "$semver"; then
            echo "::error::'$value' is not a SemVer version"
            exit 1
          fi
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: |
          dotnet tool restore
          dotnet restore NoesisToolkit.slnx

      - name: Verify formatting
        run: dotnet csharpier check .

      - name: Build
        run: dotnet build NoesisToolkit.slnx -c Release --no-restore -p:Version=${{ steps.version.outputs.value }}

      - name: Test
        run: dotnet run --project tests/NoesisToolkit.Tests -c Release --no-build

      - name: Native AOT publish
        run: dotnet publish tests/NoesisToolkit.AotSmoke -c Release -r linux-x64

      - name: Install Noesis native dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1 libx11-6

      - name: Equivalence tests
        run: dotnet run --project tests/NoesisToolkit.Equivalence.Tests -c Release --no-build

      - name: Collectability tests
        run: dotnet run --project tests/NoesisToolkit.Testing.Tests -c Release --no-build

      - name: Trimming tests
        run: |
          dotnet publish tests/NoesisToolkit.Trimming.Tests -c Release -r linux-x64
          tests/NoesisToolkit.Trimming.Tests/bin/Release/net10.0/linux-x64/publish/NoesisToolkit.Trimming.Tests

      - name: Pack
        run: dotnet pack NoesisToolkit.slnx -c Release --no-build -o artifacts -p:Version=${{ steps.version.outputs.value }}

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*

  publish:
    needs: build
    if: ${{ inputs.publish || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts

      - uses: NuGet/login@v1
        id: login
        with:
          user: vrimar

      - name: Push to NuGet
        run: dotnet nuget push "artifacts/*.nupkg" -k "${{ steps.login.outputs.NUGET_API_KEY }}" -s https://api.nuget.org/v3/index.json --skip-duplicate

  release:
    needs: [build, publish]
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          prerelease: ${{ contains(needs.build.outputs.version, '-') }}
